<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Reply on Your Post</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px;">
        <h2 style="color: #2c3e50; margin-top: 0;">🎉 Someone Replied to Your Post!</h2>
        
        <div style="background-color: white; padding: 20px; border-radius: 5px; margin: 20px 0;">
            <h3 style="color: #3498db; margin-top: 0;">{{ post_title }}</h3>
            
            <p style="color: #7f8c8d; font-size: 14px;">
                <strong>{{ commenter_name }}</strong> replied to your post
            </p>
            
            <div style="margin: 15px 0; padding: 15px; background-color: transparent; border:1px solid #4A2882; border-left: 4px solid #4A2882;">
                {{ comment_content }}
            </div>
            
            <a href="{{ post_url }}" style="display: inline-block; background-color: #4A2882; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px; margin-top: 15px;">
                View Reply
            </a>
        </div>
        
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; font-size: 12px; color: #7f8c8d;">
            <p>You're receiving this email because someone replied to your forum post.</p>
            <p>
                <a href="{{ forum_url }}" style="color: #3498db;">Visit Forum</a>
            </p>
        </div>
    </div>
</body>
</html>
