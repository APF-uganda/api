name: Deploy Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy backend to DigitalOcean
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEP_HOST }}
          username: ${{ secrets.DEP_USER }}
          key: ${{ secrets.DEP_SSH_KEY }}
          passphrase: ${{ secrets.DEP_SSH_PASSPHRASE }}
          port: ${{ secrets.DEP_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            dc() { docker compose -f /var/www/apf/docker-compose.yaml "$@"; }
            START_TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            dump_logs() {
              status="${1:-1}"
              echo "Deployment failed with exit code ${status}"
              echo "=== docker compose ps ==="
              dc ps || true
              echo "=== backend logs (last 200 lines) ==="
              dc logs --no-color --since "${START_TS}" --tail=200 backend || true
              echo "=== postgres logs (last 120 lines) ==="
              dc logs --no-color --since "${START_TS}" --tail=120 postgres || true
            }
            on_exit() {
              status=$?
              if [ "$status" -ne 0 ]; then
                dump_logs "$status"
              fi
              exit "$status"
            }
            trap on_exit EXIT
            BRANCH="${{ github.ref_name }}"
            cd /var/www/apf/api
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
            dc up -d postgres
            dc build backend
            dc run --rm backend python manage.py makemigrations --check --dry-run
            echo "=== Migration plan (before) ==="
            dc run --rm backend python manage.py showmigrations --plan
            dc run --rm backend python manage.py migrate --noinput
            echo "=== Verifying all migrations are applied ==="
            dc run --rm backend python manage.py migrate --check
            dc run --rm backend python manage.py check
            dc up -d backend
            sleep 2
            if [ "$(docker inspect -f '{{.State.Running}}' apf_backend 2>/dev/null || echo false)" != "true" ]; then
              echo "Backend container is not running after startup."
              dc logs --no-color --since "${START_TS}" --tail=200 backend || true
              exit 1
            fi
            i=1
            max_attempts=40
            until [ "$i" -gt "$max_attempts" ]; do
              state="$(docker inspect -f '{{.State.Status}}' apf_backend 2>/dev/null || echo missing)"
              if [ "$state" != "running" ]; then
                echo "Backend container state is '$state' during health check."
                dc logs --no-color --since "${START_TS}" --tail=200 backend || true
                exit 1
              fi
              code="$(curl -sS -o /tmp/backend-health.txt -w '%{http_code}' http://localhost:8000/ || true)"
              if [ "$code" = "200" ]; then
                echo "Backend health check passed."
                break
              fi
              if [ $((i % 5)) -eq 0 ] || [ "$i" -eq 1 ]; then
                echo "Health endpoint returned HTTP $code"
                head -c 300 /tmp/backend-health.txt || true
                echo
              fi
              if [ $((i % 5)) -eq 0 ]; then
                echo "Backend not ready yet. Current backend container state:"
                dc ps backend || true
              fi
              echo "Waiting for backend... attempt $i/$max_attempts"
              sleep 3
              i=$((i + 1))
            done
            if [ "$i" -gt "$max_attempts" ]; then
              echo "Backend health check failed."
              exit 1
            fi
            trap - EXIT
            echo "Backend deploy completed successfully."
